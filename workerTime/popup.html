<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工时助手</title>
    <style>
      :root {
        --bg: #f6f1e8;
        --card: #ffffff;
        --text: #1f1d1a;
        --muted: #746b61;
        --line: #d9d0c5;
        --accent: #d96c31;
        --accent-soft: rgba(217, 108, 49, 0.12);
        --safe: #237b54;
        --danger: #b93d2d;
      }

      body[data-theme-mode="dark"] {
        --bg: #161a20;
        --card: #1f252d;
        --text: #eef2f7;
        --muted: #aeb6c2;
        --line: #313944;
        --accent: #8c97ff;
        --accent-soft: rgba(140, 151, 255, 0.16);
        --safe: #63c98f;
        --danger: #ff8b7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 260px;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      button,
      select,
      input {
        font: inherit;
      }

      .page {
        position: relative;
      }

      .loading {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(246, 241, 232, 0.72);
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #d8cfc2;
        border-top-color: var(--accent);
        border-radius: 999px;
        animation: rotate 0.8s linear infinite;
      }

      .card {
        padding: 10px;
        background: var(--card);
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .row + .row {
        margin-top: 8px;
      }

      .label {
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .inline-select {
        width: 64px;
        height: 28px;
        padding: 0 6px;
        border: 1px solid #a99e91;
        background: #fff;
      }

      .action-mini {
        min-width: 50px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid #8e8376;
        background: #fff;
        cursor: pointer;
      }

      .checks {
        margin: 8px 0;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }

      .check + .check {
        margin-top: 6px;
      }

      .summary {
        margin: 8px 0;
        padding: 7px 8px;
        border: 1px solid #ece3d7;
        background: #fcfaf7;
        font-size: 12px;
      }

      .summary-line + .summary-line {
        margin-top: 4px;
      }

      .summary-line strong.is-safe {
        color: var(--safe);
      }

      .summary-line strong.is-danger {
        color: var(--danger);
      }

      .summary-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .status {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid #e8e8e8;
        background: #fff;
        cursor: pointer;
      }

      .theme-toggle img {
        width: 15px;
        height: 15px;
        display: block;
      }

      .buttons {
        display: grid;
        gap: 6px;
      }

      .button {
        width: 100%;
        height: 28px;
        border: 1px solid #8e8376;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      body[data-theme-mode="dark"] .inline-select,
      body[data-theme-mode="dark"] .action-mini,
      body[data-theme-mode="dark"] .button,
      body[data-theme-mode="dark"] .theme-toggle {
        color: var(--text);
        border-color: #44505d;
        background: #262d36;
      }

      body[data-theme-mode="dark"] .summary {
        border-color: #313944;
        background: #1a2027;
      }

      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>

      <section class="card">
        <div class="head">
          <h1 class="title">工时助手v4.3</h1>
          <button
            class="theme-toggle"
            id="themeModeToggle"
            type="button"
            aria-label="切换夜间模式"
            title="切换夜间模式"
          >
            <img id="themeModeIcon" src="./月亮.svg" alt="" />
          </button>
        </div>

        <div class="row">
          <span class="label">考勤授权链接</span>
          <button class="action-mini" id="link">打开</button>
        </div>

        <div class="row">
          <span class="label">年份</span>
          <select id="selectedYear" class="inline-select"></select>
          <span class="label">月份</span>
          <select id="selectedMonth" class="inline-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>

        <div class="checks">
          <label class="check">
            <input type="checkbox" id="includesDay" />
            <span>包含今天数据</span>
          </label>
          <label class="check">
            <input type="checkbox" id="ignoreForgetDK" />
            <span>未打卡时段计入工时(工作日)</span>
          </label>
          <label class="check">
            <input type="checkbox" id="autoOpenTable" />
            <span>授权后自动打开在线报表</span>
          </label>
        </div>

        <div id="calcContent"></div>

        <div class="buttons">
          <button class="button" id="calc">统计时长</button>
          <button class="button" id="calcOnline">在线查看报表</button>
          <button class="button" id="submit">导出报表</button>
        </div>
      </section>
    </div>

    <script type="text/javascript" src="js/popup.js"></script>
  </body>
</html>
