<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工时助手 v4.3</title>
    <style>
      :root {
        --bg: #f7f5f0;
        --panel: #ffffff;
        --text: #1d1d1f;
        --muted: #6b6b6b;
        --line: #e7e2d9;
        --accent: #d96c31;
        --accent-soft: rgba(217, 108, 49, 0.12);
        --safe: #1f7a4d;
        --danger: #b24132;
        --tag: #f3efe8;
      }

      body[data-theme-mode="dark"] {
        --bg: #15191f;
        --panel: #1d232b;
        --text: #edf2f7;
        --muted: #a8b1bc;
        --line: #303944;
        --accent: #8c97ff;
        --accent-soft: rgba(140, 151, 255, 0.14);
        --safe: #63c98f;
        --danger: #ff8b7a;
        --tag: #262d35;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      button {
        font: inherit;
      }

      .page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        line-height: 34px;
        letter-spacing: -0.03em;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toolbar-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        width: 34px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }

      .toolbar-toggle img {
        width: 16px;
        height: 16px;
        display: block;
      }

      .summary-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 10px;
      }

      .metric-card {
        padding: 4px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .metric-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .metric-value {
        display: block;
        font-size: 20px;
        line-height: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .metric-foot {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        line-height: 14px;
      }

      .metric-card.is-safe .metric-value {
        color: var(--safe);
      }

      .metric-card.is-danger .metric-value {
        color: var(--danger);
      }

      .table-shell,
      .panel {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
      }

      .table-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .table-title {
        font-size: 18px;
        font-weight: 700;
        line-height: 24px;
      }

      .table-subtitle {
        color: var(--muted);
        font-size: 12px;
        line-height: 16px;
      }

      .table-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .table-pill-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .table-scroll {
        overflow: auto;
      }

      table {
        width: 100%;
        min-width: 1180px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 2px 10px;
        border: 1px solid var(--line);
        text-align: center;
        vertical-align: middle;
      }

      th {
        padding: 8px 10px;
        position: sticky;
        top: 0;
        background: var(--bg);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        line-height: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        z-index: 1;
      }

      .date-main,
      .value-strong,
      .week-time,
      .week-index {
        font-weight: 600;
      }

      .mono-text,
      .cell-note {
        color: var(--muted);
        line-height: 1.5;
      }

      .cell-note {
        font-size: 11px;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 0 8px;
        border-radius: 4px;
        background: var(--tag);
        color: var(--muted);
        font-size: 11px;
        line-height: 14px;
      }

      .tip-positive {
        color: var(--safe);
      }

      .tip-negative {
        color: var(--danger);
      }

      .week-card {
        min-width: 180px;
        text-align: center;
      }

      .week-diff {
        margin-top: 4px;
      }

      .pending-miss-row {
        background: rgba(178, 65, 50, 0.08);
      }

      .pending-miss-row:hover {
        background: rgba(178, 65, 50, 0.12);
      }

      .foot-tip {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        color: var(--text);
        font-size: 12px;
        line-height: 18px;
        white-space: nowrap;
        overflow-x: auto;
      }

      .foot-tip-label {
        flex-shrink: 0;
        padding: 1px 8px;
        background: #ff735f;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: lowercase;
      }

      .foot-tip-text {
        color: var(--muted);
      }

      .foot-tip strong {
        color: var(--danger);
        font-weight: 600;
      }

      .empty-state {
        padding: 54px 16px;
        text-align: center;
      }

      .empty-title {
        font-size: 24px;
        font-weight: 700;
      }

      .empty-text {
        margin-top: 10px;
        color: var(--muted);
      }

      @media (max-width: 1100px) {
        .summary-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 900px) {
        .page {
          padding: 12px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .summary-strip {
          grid-template-columns: 1fr;
        }

        .table-head {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <h1 class="title">工时助手v4.3</h1>
        <div class="toolbar">
          <button
            id="themeModeToggle"
            class="toolbar-toggle"
            type="button"
            aria-label="切换夜间模式"
            title="切换夜间模式"
          >
            <img id="themeModeIcon" src="../月亮.svg" alt="" />
          </button>
        </div>
      </header>

      <div id="table-content"></div>
    </div>

    <script type="module" src="./calc.js"></script>
  </body>
</html>
